server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fonts never change under the same name: cache for a year.
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images keep their names when replaced (og-image.png did), so a day at most.
    location ~* \.(png|svg|ico|webp)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # CSS & JS: always revalidate. A 7-day cache let Cloudflare serve the old stylesheet with the new HTML.
    # index.html also adds ?v=<commit> to both, which bypasses copies already cached under the bare URL.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # HTML Caching (Always fresh)
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
