<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Murqin</title>
    <meta name="description" content="Personal site of Murqin — tech hobbyist tinkering with random projects.">
    <meta name="theme-color" content="#0A0A0B">

    <!-- Open Graph / Social Meta -->
    <meta property="og:title" content="Murqin">
    <meta property="og:description" content="Just a tech hobbyist who spends most of his time playing video games, listening to music, and casually tinkering with random projects.">
    <meta property="og:url" content="https://murq.in/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://murq.in/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Murqin">
    <meta name="twitter:description" content="Personal site of Murqin">
    <meta name="twitter:image" content="https://murq.in/assets/og-image.png">

    <!-- Favicon & Preloads -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preload" href="assets/fonts/geist-400-normal-4.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/geist-600-normal-14.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/geist-mono-400-normal-4.woff2" as="font" type="font/woff2" crossorigin>
    
    <link rel="stylesheet" href="style.css">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Murqin",
      "url": "https://murq.in/",
      "image": "https://murq.in/assets/avatar.png",
      "sameAs": [
        "https://github.com/Murqin",
        "https://steamcommunity.com/id/murqin/",
        "https://www.youtube.com/@Murqin",
        "https://www.instagram.com/murqin/"
      ]
    }
    </script>
</head>
<body>
    <main class="card">
        <!-- Live Status & Local Time Header -->
        <div class="meta-status reveal" aria-label="System status and local time">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="local-time" class="time-text">--:--:--</span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <span class="tz-text">UTC+3</span>
        </div>

        <img
            class="avatar reveal"
            src="assets/avatar.png"
            width="92"
            height="92"
            alt="Murqin avatar"
            decoding="async"
            fetchpriority="high"
        >

        <h1 class="name reveal">Murqin</h1>

        <p class="bio reveal">
            Just a tech hobbyist who spends most of his time playing video games,
            listening to music, and casually tinkering with random projects.
        </p>

        <nav class="links reveal" aria-label="Social links and shortcuts">
            <a class="pill" href="https://github.com/Murqin" target="_blank" rel="noopener noreferrer" data-key="1">
                <span class="pill-kbd" aria-hidden="true">1</span>
                <span>GitHub</span>
            </a>
            <a class="pill" href="https://steamcommunity.com/id/murqin/" target="_blank" rel="noopener noreferrer" data-key="2">
                <span class="pill-kbd" aria-hidden="true">2</span>
                <span>Steam</span>
            </a>
            <a class="pill" href="https://www.youtube.com/@Murqin" target="_blank" rel="noopener noreferrer" data-key="3">
                <span class="pill-kbd" aria-hidden="true">3</span>
                <span>YouTube</span>
            </a>
            <a class="pill" href="https://www.instagram.com/murqin/" target="_blank" rel="noopener noreferrer" data-key="4">
                <span class="pill-kbd" aria-hidden="true">4</span>
                <span>Instagram</span>
            </a>
            <button type="button" class="pill pill-copy" id="email-btn" data-email="murqin@proton.me" data-key="5" aria-label="Copy email address">
                <span class="pill-kbd" aria-hidden="true">5</span>
                <span class="pill-text">Email</span>
            </button>
        </nav>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
