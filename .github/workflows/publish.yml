name: Publish container image

on:
  push:
    branches: [main, astro-migration]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/murqin/murq.in

jobs:
  publish:
    # The server this deploys to is an OCI Ampere box, so build natively on an
    # arm64 runner instead of emulating it through QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main publishes :latest. Everything else lands on :staging so a
      # Cosmos container tracking :latest can never pull an in-progress branch.
      - id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.moving }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
